<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Ticket submitted — Kiwi</title>
    <style>
      :root { color-scheme: light; font-family: Arial, Helvetica, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fff; color: #000; }
      main { width: min(34rem, calc(100% - 2rem)); border: 2px solid #000; padding: clamp(1.5rem, 5vw, 3rem); }
      h1 { margin: 0 0 1rem; font-size: clamp(2rem, 8vw, 4rem); line-height: .95; }
      p { font-size: 1.05rem; line-height: 1.55; }
      button, a { display: inline-block; margin-top: 1rem; border: 2px solid #000; background: #000; color: #fff; padding: .8rem 1rem; font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>Ticket submitted.</h1>
      <p>Your request was saved in SharePoint. This window will close automatically and Kiwi is still open behind it.</p>
      <button id="close-button" type="button">Close and return to Kiwi</button>
      <noscript><p><a href="./">Return to Kiwi</a></p></noscript>
    </main>
    <script>
      (() => {
        const message = { type: "kiwi-ticket-created" };
        if (window.opener && !window.opener.closed) {
          window.opener.postMessage(message, window.location.origin);
          window.opener.focus();
        }

        const closeWindow = () => window.close();
        document.getElementById("close-button").addEventListener("click", closeWindow);
        window.setTimeout(closeWindow, 900);
      })();
    </script>
  </body>
</html>
